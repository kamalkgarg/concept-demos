<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Professional Linear Regression Cost Surface</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
html,body{
margin:0;padding:0;width:100%;height:100%;
overflow:hidden;font-family:Arial,sans-serif;
}
body{padding:10px;box-sizing:border-box;}
h2{margin:0 0 8px 0;font-size:24px;}
.controls{
display:flex;gap:25px;align-items:center;
flex-wrap:wrap;margin-bottom:8px;font-size:18px;
}
input[type=range]{width:240px;}
.info{font-size:20px;font-weight:bold;}
.row{
display:flex;
gap:10px;
height:calc(100vh - 95px);
}
.plot{
width:50%;
height:100%;
}
</style>
</head>
<body>

<h2>Linear Regression: ŷ = wx + b and Cost Surface J(w,b)</h2>

<div class="controls">
<div>
<b>w:</b>
<input id="wSlider" type="range" min="-2" max="3" step="0.01" value="1">
<span id="wVal">1.00</span>
</div>

<div>
<b>b:</b>
<input id="bSlider" type="range" min="-3" max="4" step="0.01" value="0">
<span id="bVal">0.00</span>
</div>

<div class="info">
J(w,b)= <span id="costVal"></span>
</div>
</div>

<div class="row">
<div id="left" class="plot"></div>
<div id="right" class="plot"></div>
</div>

<script>

const x=[1,2,3,4,5,6];
const y=[2.2,2.8,3.7,5.1,5.8,7.2];

function cost(w,b){
 let s=0;
 for(let i=0;i<x.length;i++){
   let e=w*x[i]+b-y[i];
   s+=e*e;
 }
 return s/x.length;
}

// OLS optimum
const n=x.length;
let sx=0,sy=0,sxy=0,sx2=0;

for(let i=0;i<n;i++){
 sx+=x[i];
 sy+=y[i];
 sxy+=x[i]*y[i];
 sx2+=x[i]*x[i];
}

const wStar=(n*sxy-sx*sy)/(n*sx2-sx*sx);
const bStar=(sy-wStar*sx)/n;

// Surface grid
const wr=[];
const br=[];

for(let w=-2;w<=3.001;w+=0.1) wr.push(+w.toFixed(2));
for(let b=-3;b<=4.001;b+=0.1) br.push(+b.toFixed(2));

const Z=[];
let zmax=0;

for(let i=0;i<br.length;i++){
 let row=[];
 for(let j=0;j<wr.length;j++){
   const z=cost(wr[j],br[i]);
   row.push(z);
   zmax=Math.max(zmax,z);
 }
 Z.push(row);
}

let currentCamera={
 eye:{x:1.7,y:1.5,z:1.2}
};

function drawLeft(w,b){

 const residuals=[];

 for(let i=0;i<x.length;i++){
   residuals.push({
      type:'line',
      x0:x[i],
      y0:y[i],
      x1:x[i],
      y1:w*x[i]+b,
      line:{color:'red',width:2}
   });
 }

 Plotly.react('left',[
 {
   x:x,y:y,
   mode:'markers',
   name:'Training Data',
   marker:{size:10}
 },
 {
   x:[0,7],
   y:[b,7*w+b],
   mode:'lines',
   name:'ŷ = wx + b',
   line:{width:4}
 }
 ],{
 title:'Regression Model',
 margin:{l:70,r:20,t:50,b:50},
 xaxis:{title:'x',range:[0,7],autorange:false},
 yaxis:{title:'y',range:[-2,10],autorange:false},
 shapes:residuals
 });
}

function init3D(){

 const w0=1;
 const b0=0;
 const J0=cost(w0,b0);

 Plotly.newPlot('right',[

 {
  type:'surface',
  x:wr,
  y:br,
  z:Z,
  opacity:0.95,
  showscale:true,
  contours:{
    z:{
      show:true,
      usecolormap:true,
      project:{z:true}
    }
  },
  name:'Surface'
 },

 {
  type:'scatter3d',
  mode:'markers',
  x:[wStar],
  y:[bStar],
  z:[cost(wStar,bStar)],
  marker:{
    size:5,
    color:'green'
  },
  name:'Optimal'
 },

 {
  type:'scatter3d',
  mode:'markers',
  x:[w0],
  y:[b0],
  z:[J0],
  marker:{
    size:6,
    color:'red'
  },
  name:'Current'
 },

 {
  type:'scatter3d',
  mode:'lines',
  x:[w0,w0],
  y:[b0,b0],
  z:[0,J0],
  line:{
    color:'red',
    width:6
  },
  showlegend:false
 }

 ],{

 title:'Cost Surface J(w,b)',

 margin:{l:0,r:0,t:50,b:0},

 scene:{

  xaxis:{
   title:'w',
   range:[-2,3],
   autorange:false
  },

  yaxis:{
   title:'b',
   range:[-3,4],
   autorange:false
  },

  zaxis:{
   title:'Cost',
   range:[0,zmax*1.05],
   autorange:false
  },

  aspectmode:'manual',

  aspectratio:{
   x:1,
   y:1,
   z:0.7
  },

  camera:currentCamera
 }

 });

 const gd=document.getElementById('right');

 gd.on('plotly_relayout',function(e){
   if(e['scene.camera']){
      currentCamera=e['scene.camera'];
   }
 });

}

function update3D(w,b){

 const J=cost(w,b);

 Plotly.restyle('right',{
   x:[[w]],
   y:[[b]],
   z:[[J]]
 },[2]);

 Plotly.restyle('right',{
   x:[[w,w]],
   y:[[b,b]],
   z:[[0,J]]
 },[3]);

 document.getElementById('costVal').innerText=J.toFixed(4);
}

function update(){

 const w=parseFloat(document.getElementById('wSlider').value);
 const b=parseFloat(document.getElementById('bSlider').value);

 document.getElementById('wVal').innerText=w.toFixed(2);
 document.getElementById('bVal').innerText=b.toFixed(2);

 drawLeft(w,b);
 update3D(w,b);
}

drawLeft(1,0);
init3D();
update();

document.getElementById('wSlider').addEventListener('input',update);
document.getElementById('bSlider').addEventListener('input',update);

</script>

</body>
</html>
