
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Linear Regression Cost Demo - Final with Cost Display</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}
body{
    padding:18px;
    box-sizing:border-box;
}
h2{
    font-size:28px;
    margin:0 0 12px 0;
}
.controls{
    font-size:22px;
    margin-bottom:12px;
}
.info{
    margin-top:8px;
    font-size:24px;
    font-weight:bold;
}
.row{
    display:flex;
    gap:16px;
    height:calc(100vh - 170px);
}
.plot{
    width:50%;
    height:100%;
}
#wslider{
    width:500px;
}
</style>
</head>

<body>

<h2>Linear Regression (b = 0): Effect of w on Predictions and Cost</h2>

<div class="controls">
    <b>w = </b><span id="wval">1.00</span>
    <br><br>
    <input type="range" id="wslider"
           min="-1" max="3" step="0.01" value="1">

    <div class="info">
        J(w) = <span id="costval">0.0000</span>
    </div>
</div>

<div class="row">
    <div id="left" class="plot"></div>
    <div id="right" class="plot"></div>
</div>

<script>

// Dataset intentionally chosen so min(J)>0
const x=[1,2,3,4,5];
const y=[1.8,1.9,3.7,3.9,6.2];

function cost(w){
    let s=0;
    for(let i=0;i<x.length;i++){
        s += (w*x[i]-y[i])**2;
    }
    return s/x.length;
}

const wGrid=[];
const jGrid=[];

for(let w=-1; w<=3.0001; w+=0.02){
    wGrid.push(w);
    jGrid.push(cost(w));
}

const maxJ=Math.max(...jGrid);

function update(w){

    const lineX=[0,6];
    const lineY=[0,6*w];

    const residuals=[];

    for(let i=0;i<x.length;i++){
        residuals.push({
            type:'line',
            x0:x[i],
            y0:y[i],
            x1:x[i],
            y1:w*x[i],
            line:{
                color:'red',
                width:2
            }
        });
    }

    Plotly.react('left',[
        {
            x:x,
            y:y,
            mode:'markers',
            name:'Training Data',
            marker:{size:10}
        },
        {
            x:lineX,
            y:lineY,
            mode:'lines',
            name:'ŷ = wx',
            line:{width:4}
        }
    ],{
        title:{
            text:'Prediction Model: ŷ = wx',
            font:{size:24}
        },
        margin:{l:90,r:50,t:80,b:100},
        xaxis:{
            title:{text:'x',font:{size:20}},
            tickfont:{size:18},
            range:[0,6],
            fixedrange:true
        },
        yaxis:{
            title:{text:'y',font:{size:20}},
            tickfont:{size:18},
            range:[-6,12],
            fixedrange:true
        },
        legend:{font:{size:18}},
        shapes:residuals
    },{responsive:true});

    const jw=cost(w);

    Plotly.react('right',[
        {
            x:wGrid,
            y:jGrid,
            mode:'lines',
            name:'J(w)',
            line:{width:4}
        },
        {
            x:[w],
            y:[jw],
            mode:'markers',
            name:'Current w',
            marker:{size:14}
        }
    ],{
        title:{
            text:'Cost Function J(w)',
            font:{size:24}
        },
        margin:{l:90,r:50,t:80,b:100},
        xaxis:{
            title:{text:'w',font:{size:20}},
            tickfont:{size:18},
            range:[-1,3],
            fixedrange:true
        },
        yaxis:{
            title:{text:'Cost',font:{size:20}},
            tickfont:{size:18},
            range:[0,maxJ*1.1],
            fixedrange:true
        },
        legend:{font:{size:18}}
    },{responsive:true});

    document.getElementById("wval").innerText = w.toFixed(2);
    document.getElementById("costval").innerText = jw.toFixed(4);
}

document.getElementById("wslider").addEventListener(
    "input",
    e => update(parseFloat(e.target.value))
);

update(1.0);

</script>
</body>
</html>
